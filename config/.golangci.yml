version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - misspell
    - unconvert
    - bodyclose
    - depguard
  disable:
    - godot
    - godox
    - revive
  settings:
    depguard:
      rules:
        domain-no-infra:
          files:
            - "**/internal/domain/**"
          deny:
            - pkg: "github.com/gofiber/fiber"
              desc: "domain must not import delivery frameworks (clean-arch: domain has no outward deps)"
            - pkg: "github.com/jackc/pgx"
              desc: "domain must not import persistence drivers (clean-arch: domain has no outward deps)"
            - pkg: "github.com/hibiken/asynq"
              desc: "domain must not import queue drivers (clean-arch: domain has no outward deps)"
            - pkg: "github.com/go-telegram/bot"
              desc: "domain must not import bot drivers (clean-arch: domain has no outward deps)"
            - pkg: "github.com/luckyrogue/lead-cat/internal/application"
              desc: "domain must not depend on application layer (clean-arch: deps point inward)"
            - pkg: "github.com/luckyrogue/lead-cat/internal/infrastructure"
              desc: "domain must not depend on infrastructure layer (clean-arch: deps point inward)"
            - pkg: "github.com/luckyrogue/lead-cat/internal/delivery"
              desc: "domain must not depend on delivery layer (clean-arch: deps point inward)"
            - pkg: "github.com/luckyrogue/lead-cat/internal/platform"
              desc: "domain must not depend on platform layer (clean-arch: deps point inward)"
        application-no-infra:
          files:
            - "**/internal/application/**"
          deny:
            - pkg: "github.com/jackc/pgx"
              desc: "application must not import the postgres driver — depend on the Repository port (clean-arch: deps point inward)"
            - pkg: "github.com/luckyrogue/lead-cat/internal/infrastructure"
              desc: "application must not import infrastructure — depend on the ports it implements (Repository, Cipher, JobQueue, CalendarProvider, GoogleProber) (clean-arch: deps point inward)"
            - pkg: "github.com/luckyrogue/lead-cat/internal/delivery"
              desc: "application must not depend on the delivery layer (clean-arch: deps point inward)"
        delivery-no-direct-db:
          files:
            - "**/internal/delivery/**"
          deny:
            - pkg: "github.com/jackc/pgx"
              desc: "delivery must not import the postgres driver directly — use the application layer"
            - pkg: "github.com/luckyrogue/lead-cat/internal/infrastructure/persistence/postgres"
              desc: "delivery must not import the postgres repository directly — use the application layer and application/model"
  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/luckyrogue/lead-cat
