# OWASP ZAP baseline rule config. Format: <ruleId>\t(IGNORE|WARN|FAIL)\t<comment>

# 10038 = Content Security Policy (Header Not Set). SPA content-CSP is a tracked
# follow-up (anti-framing already covered by X-Frame-Options / mini-app frame-ancestors).
10038	IGNORE	SPA content-CSP deferred (anti-framing already covered)

# 10036 = Server leaks version via Server header. nginx static-asset responses include
# default nginx version. server_tokens off would suppress it; low-risk informational leak.
# Accepted: not exploitable in isolation, fix tracked as nginx hardening follow-up.
10036	IGNORE	nginx version in Server header on static assets — low-risk, tracked follow-up

# 10049 = Storable and Cacheable Content. Static assets (images, fonts, manifests) are
# intentionally cached — this is correct nginx behavior for SPA builds.
10049	IGNORE	Static asset caching is intentional for SPA builds

# 10109 = Modern Web Application. ZAP informational: can't fully parse JS SPA.
# Not a vulnerability — just ZAP noting it can't spider the app fully via JS.
10109	IGNORE	Informational — ZAP passive limit on JS SPAs; no security implication

# 90004 = Cross-Origin-Embedder-Policy header missing. COEP is required only for
# SharedArrayBuffer isolation (e.g. WebAssembly threading). Not used in this app.
90004	IGNORE	COEP not required — no SharedArrayBuffer or cross-origin isolation needed

# 10010 = Cookie No HttpOnly (landing only). The leadcat_locale cookie stores the user's
# UI language preference and is intentionally readable by JS for locale switching.
# It carries no session or auth data; HttpOnly would break the locale feature.
10010	IGNORE	leadcat_locale is a UI preference cookie that JS must be able to read

# 10017 = Cross-Domain JS File Inclusion (mini-app only). Telegram Mini Apps load
# Telegram's official SDK from telegram.org CDN. This is architecturally required.
10017	IGNORE	Telegram SDK loaded from telegram.org CDN — required by Mini App architecture

# 10055 = CSP Failure to Define Directive with No Fallback (mini-app only). The mini-app's
# CSP is intentionally frame-ancestors-only (deploy/nginx/security-headers-miniapp.conf)
# to allow Telegram iframe embedding. A full content-CSP is a tracked follow-up (see 10038).
10055	IGNORE	mini-app CSP is frame-ancestors-only by design; full content-CSP deferred

# 90003 = Sub Resource Integrity missing (mini-app only). The Telegram SDK is loaded from
# Telegram's CDN; pinning SRI would break on Telegram SDK updates out of our control.
90003	IGNORE	Telegram SDK SRI not pinnable — loaded from vendor CDN (telegram.org)
