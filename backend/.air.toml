# Hot reload: go install github.com/air-verse/air@latest && make backend-watch
root = "."
tmp_dir = "tmp"

[build]
  cmd = "env -u GOROOT go build -o ./tmp/lead-cat ./cmd/server"
  bin = "./tmp/lead-cat"
  include_ext = ["go"]
  exclude_dir = ["tmp", "bin", "vendor"]
  delay = 400
  stop_on_error = true
  send_interrupt = true
  kill_delay = 500

[log]
  time = false

[misc]
  clean_on_exit = true
