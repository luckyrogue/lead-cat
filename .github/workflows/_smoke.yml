name: _smoke

on:
  workflow_call:

jobs:
  smoke:
    name: smoke / e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: notify
          POSTGRES_PASSWORD: notify
          POSTGRES_DB: notify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum

      - run: go mod download
      - run: go run ./cmd/migrate up
        env:
          DATABASE_URL: postgres://notify:notify@localhost:5432/notify?sslmode=disable

      - name: start server
        run: |
          go build -o /tmp/lead-cat ./cmd/server
          /tmp/lead-cat &
          echo $! > /tmp/lead-cat.pid
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/api/health && break
            sleep 1
          done
        env:
          AUTH_DEV_MODE: "true"
          AUTO_MIGRATE: "true"
          BOT_TOKEN: "000000000:AAFakeSmokeTestTokenForCIOnly"
          DATABASE_URL: postgres://notify:notify@localhost:5432/notify?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
          MASTER_ENCRYPTION_KEY: "smoke-test-key-32bytes!!"
          HTTP_ADDR: ":8080"
          CALENDAR_STUB: "true"

      - run: go test -tags=smoke -count=1 ./test/smoke/...
        env:
          SMOKE_BASE_URL: http://localhost:8080
          SMOKE_TOKEN: Bearer smoke-owner
          SMOKE_TOKEN_B: Bearer smoke-stranger
          SMOKE_SKIP_VCS: "1"

      - name: stop server
        if: always()
        run: |
          if [ -f /tmp/lead-cat.pid ]; then kill "$(cat /tmp/lead-cat.pid)" || true; fi
