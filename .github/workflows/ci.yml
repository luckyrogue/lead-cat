name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  go:
    name: build / go
    uses: ./.github/workflows/_build-go.yml

  pnpm-checks:
    name: build / pnpm-checks
    uses: ./.github/workflows/_build-pnpm-checks.yml

  frontend-build:
    name: build / frontend-build
    uses: ./.github/workflows/_build-frontend.yml

  security:
    name: security
    uses: ./.github/workflows/_security.yml

  e2e-smoke:
    name: e2e / smoke
    needs: frontend-build
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    uses: ./.github/workflows/_e2e-smoke.yml

  e2e-full:
    name: e2e / full
    needs: [go, pnpm-checks, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_e2e-full.yml
    with:
      suite: full

  docker:
    name: docker
    needs: [go, pnpm-checks, frontend-build, e2e-smoke, security]
    if: |
      success() &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    uses: ./.github/workflows/_docker.yml
    with:
      push: true
    secrets:
      DOKPLOY_WEBHOOK_BACKEND: ${{ secrets.DOKPLOY_WEBHOOK_BACKEND }}
      DOKPLOY_WEBHOOK_LANDING: ${{ secrets.DOKPLOY_WEBHOOK_LANDING }}
      DOKPLOY_WEBHOOK_ADMIN: ${{ secrets.DOKPLOY_WEBHOOK_ADMIN }}
      DOKPLOY_WEBHOOK_MINI_APP: ${{ secrets.DOKPLOY_WEBHOOK_MINI_APP }}
    permissions:
      contents: read
      packages: write
