name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    name: build
    uses: ./.github/workflows/_build.yml

  docker-validate:
    name: docker (validate)
    needs: build
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/_docker.yml
    with:
      push: false
    permissions:
      contents: read
      packages: write

  docker:
    name: docker
    needs: build
    if: |
      success() &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    uses: ./.github/workflows/_docker.yml
    with:
      push: true
    secrets:
      DOKPLOY_WEBHOOK_BACKEND: ${{ secrets.DOKPLOY_WEBHOOK_BACKEND }}
      DOKPLOY_WEBHOOK_LANDING: ${{ secrets.DOKPLOY_WEBHOOK_LANDING }}
      DOKPLOY_WEBHOOK_ADMIN: ${{ secrets.DOKPLOY_WEBHOOK_ADMIN }}
      DOKPLOY_WEBHOOK_MINI_APP: ${{ secrets.DOKPLOY_WEBHOOK_MINI_APP }}
    permissions:
      contents: read
      packages: write
