name: Backend

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum

      - run: go mod download
      - run: go vet ./...
      - run: go build -o /dev/null ./cmd/server ./cmd/migrate

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: apps/backend

      - name: golangci fmt
        run: golangci-lint fmt --diff

      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: govulncheck
        run: govulncheck ./...

  deploy:
    name: deploy
    needs: backend
    if: |
      success() &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Tag
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4

      - name: Image
        id: img
        run: |
          OWNER_LC=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER_LC}/lead-cat-backend" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.img.outputs.image }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Dokploy
        env:
          IMAGE: ${{ steps.img.outputs.image }}:${{ steps.meta.outputs.tag }}
          WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK_BACKEND }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::error::DOKPLOY_WEBHOOK_BACKEND is not configured"
            exit 1
          fi
          curl -fsSL -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"image\":\"${IMAGE}\"}"
