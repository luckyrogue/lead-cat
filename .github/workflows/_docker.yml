name: _docker

on:
  workflow_call:
    inputs:
      push:
        type: boolean
        required: true
    outputs:
      tag:
        description: "Тег образов для Dokploy webhook"
        value: ${{ jobs.meta.outputs.tag }}

permissions:
  contents: read
  packages: write

jobs:
  meta:
    name: docker / tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${GITHUB_SHA}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: docker / ${{ matrix.service }}
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [backend, landing, admin, mini-app]
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }

      - uses: docker/setup-buildx-action@v4

      - name: Image name
        id: img
        run: |
          OWNER_LC=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER_LC}/lead-cat-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: ${{ inputs.push }}
          load: ${{ !inputs.push }}
          tags: |
            ${{ steps.img.outputs.image }}:${{ needs.meta.outputs.tag }}
            ${{ steps.img.outputs.image }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
