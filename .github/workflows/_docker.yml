name: _docker

on:
  workflow_call:
    inputs:
      push:
        type: boolean
        required: true
    secrets:
      DOKPLOY_WEBHOOK_BACKEND:
        required: false
      DOKPLOY_WEBHOOK_LANDING:
        required: false
      DOKPLOY_WEBHOOK_ADMIN:
        required: false
      DOKPLOY_WEBHOOK_MINI_APP:
        required: false

permissions:
  contents: read
  packages: write

jobs:
  release:
    name: ${{ matrix.service }} / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [backend, landing, admin, mini-app]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Tag
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4

      - name: Name
        id: img
        run: |
          OWNER_LC=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER_LC}/lead-cat-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Args
        id: buildargs
        env:
          SERVICE: ${{ matrix.service }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BOT_USERNAME: ${{ vars.VITE_BOT_USERNAME }}
          VITE_TMA_DEV_TG_ID: ${{ vars.VITE_TMA_DEV_TG_ID }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
        run: |
          VITE_BOT_USERNAME="${VITE_BOT_USERNAME:-lead_cat_bot}"
          VITE_SITE_URL="${VITE_SITE_URL:-https://lead-cat.space}"

          case "$SERVICE" in
            mini-app)
              {
                echo 'build_args<<EOF'
                echo "VITE_API_URL=${VITE_API_URL}"
                echo "VITE_BOT_USERNAME=${VITE_BOT_USERNAME}"
                echo "VITE_TMA_DEV_TG_ID=${VITE_TMA_DEV_TG_ID}"
                echo 'EOF'
              } >> "$GITHUB_OUTPUT"
              ;;
            admin)
              {
                echo 'build_args<<EOF'
                echo "VITE_API_URL=${VITE_API_URL}"
                echo 'EOF'
              } >> "$GITHUB_OUTPUT"
              ;;
            landing)
              {
                echo 'build_args<<EOF'
                echo "VITE_SITE_URL=${VITE_SITE_URL}"
                echo "VITE_BOT_USERNAME=${VITE_BOT_USERNAME:-lead_cat_bot}"
                echo "VITE_ADMIN_URL=${VITE_ADMIN_URL:-}"
                echo 'EOF'
              } >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: ${{ inputs.push }}
          load: ${{ !inputs.push }}
          build-args: ${{ steps.buildargs.outputs.build_args }}
          tags: |
            ${{ steps.img.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.img.outputs.image }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Deploy
        if: inputs.push
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE: ${{ steps.img.outputs.image }}:${{ steps.meta.outputs.tag }}
          WEBHOOK_BACKEND: ${{ secrets.DOKPLOY_WEBHOOK_BACKEND }}
          WEBHOOK_LANDING: ${{ secrets.DOKPLOY_WEBHOOK_LANDING }}
          WEBHOOK_ADMIN: ${{ secrets.DOKPLOY_WEBHOOK_ADMIN }}
          WEBHOOK_MINI_APP: ${{ secrets.DOKPLOY_WEBHOOK_MINI_APP }}
        run: |
          case "$SERVICE" in
            backend) WEBHOOK="$WEBHOOK_BACKEND" ;;
            landing) WEBHOOK="$WEBHOOK_LANDING" ;;
            admin) WEBHOOK="$WEBHOOK_ADMIN" ;;
            mini-app) WEBHOOK="$WEBHOOK_MINI_APP" ;;
            *)
              echo "::error::Unknown service: $SERVICE"
              exit 1
              ;;
          esac

          if [ -z "$WEBHOOK" ]; then
            echo "::warning::DOKPLOY webhook for $SERVICE is not configured, skipping deploy"
            exit 0
          fi

          echo "Deploying $IMAGE via Dokploy"
          curl -fsSL -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"image\":\"${IMAGE}\"}"
