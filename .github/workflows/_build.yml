name: _build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    name: go / build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum

      - run: go mod download
      - run: go vet ./...
      - run: go build -o /dev/null ./cmd/server ./cmd/migrate
      - run: go test ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12.2
          working-directory: apps/backend
          args: --config ../../config/.golangci.yml

  frontend:
    name: pnpm / build workspace
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter admin --filter mini-app --filter landing typecheck
      - run: pnpm --filter admin --filter mini-app --filter landing lint
      - run: pnpm --filter admin --filter mini-app --filter landing build
