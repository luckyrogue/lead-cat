name: _build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum

      - run: go mod download
      - run: go vet ./...
      - run: go build -o /dev/null ./cmd/server ./cmd/migrate
      - run: go test -race ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: apps/backend
          args: --config ../../config/.golangci.yml

      - name: golangci fmt
        run: golangci-lint fmt --diff --config ../../config/.golangci.yml

  frontend:
    name: pnpm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Turbo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - run: pnpm turbo run format:check test typecheck lint build --filter=./apps/* --filter=@leadcat/ui

      - name: OpenAPI drift check
        run: |
          pnpm openapi:generate
          git diff --exit-code -- \
            apps/backend/openapi/openapi.json \
            packages/api-client/src/generated/schema.ts
