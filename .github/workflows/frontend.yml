name: Frontend

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

      - name: Cache turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - run: pnpm turbo run format:check typecheck lint --filter=./apps/* --filter=@leadcat/ui

      - name: OpenAPI
        run: |
          pnpm openapi:generate
          git diff --exit-code -- \
            apps/backend/openapi/openapi.json \
            packages/api-client/src/generated/schema.ts

      - run: pnpm turbo run build --filter=admin --filter=mini-app --filter=landing --filter=@leadcat/brand

  deploy-deps:
    name: deploy / frontend-deps
    needs: frontend
    if: |
      success() &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Tag
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4

      - name: Image
        id: img
        run: |
          OWNER_LC=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER_LC}/lead-cat-frontend-deps" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.frontend-deps
          push: true
          tags: |
            ${{ steps.img.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.img.outputs.image }}:latest
          cache-from: type=gha,scope=frontend-deps
          cache-to: type=gha,mode=max,scope=frontend-deps

  deploy:
    name: deploy / ${{ matrix.service }}
    needs: deploy-deps
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [admin, mini-app, landing]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Tag
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4

      - name: Image
        id: img
        run: |
          OWNER_LC=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER_LC}/lead-cat-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build args
        id: buildargs
        env:
          SERVICE: ${{ matrix.service }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BOT_USERNAME: ${{ vars.VITE_BOT_USERNAME }}
          VITE_TMA_DEV_TG_ID: ${{ vars.VITE_TMA_DEV_TG_ID }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_ADMIN_URL: ${{ vars.VITE_ADMIN_URL }}
        run: |
          OWNER_LC=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          DEPS_IMAGE="ghcr.io/${OWNER_LC}/lead-cat-frontend-deps:${{ steps.meta.outputs.tag }}"
          VITE_BOT_USERNAME="${VITE_BOT_USERNAME:-lead_cat_bot}"
          VITE_SITE_URL="${VITE_SITE_URL:-https://lead-cat.space}"

          case "$SERVICE" in
            mini-app)
              if [ -n "${VITE_TMA_DEV_TG_ID}" ]; then
                echo "::error::VITE_TMA_DEV_TG_ID must not be set for production mini-app builds"
                exit 1
              fi
              {
                echo 'build_args<<EOF'
                echo "FRONTEND_DEPS_IMAGE=${DEPS_IMAGE}"
                echo "VITE_API_URL=${VITE_API_URL}"
                echo "VITE_BOT_USERNAME=${VITE_BOT_USERNAME}"
                echo "VITE_TMA_DEV_TG_ID="
                echo 'EOF'
              } >> "$GITHUB_OUTPUT"
              ;;
            admin)
              {
                echo 'build_args<<EOF'
                echo "FRONTEND_DEPS_IMAGE=${DEPS_IMAGE}"
                echo "VITE_API_URL=${VITE_API_URL}"
                echo 'EOF'
              } >> "$GITHUB_OUTPUT"
              ;;
            landing)
              {
                echo 'build_args<<EOF'
                echo "FRONTEND_DEPS_IMAGE=${DEPS_IMAGE}"
                echo "VITE_SITE_URL=${VITE_SITE_URL}"
                echo "VITE_BOT_USERNAME=${VITE_BOT_USERNAME}"
                echo "VITE_ADMIN_URL=${VITE_ADMIN_URL:-}"
                echo 'EOF'
              } >> "$GITHUB_OUTPUT"
              ;;
          esac

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          build-args: ${{ steps.buildargs.outputs.build_args }}
          tags: |
            ${{ steps.img.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.img.outputs.image }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Dokploy
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE: ${{ steps.img.outputs.image }}:${{ steps.meta.outputs.tag }}
          WEBHOOK_ADMIN: ${{ secrets.DOKPLOY_WEBHOOK_ADMIN }}
          WEBHOOK_MINI_APP: ${{ secrets.DOKPLOY_WEBHOOK_MINI_APP }}
          WEBHOOK_LANDING: ${{ secrets.DOKPLOY_WEBHOOK_LANDING }}
        run: |
          case "$SERVICE" in
            admin) WEBHOOK="$WEBHOOK_ADMIN" ;;
            mini-app) WEBHOOK="$WEBHOOK_MINI_APP" ;;
            landing) WEBHOOK="$WEBHOOK_LANDING" ;;
          esac

          if [ -z "$WEBHOOK" ]; then
            echo "::error::Dokploy webhook for $SERVICE is not configured"
            exit 1
          fi

          curl -fsSL -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"image\":\"${IMAGE}\"}"
