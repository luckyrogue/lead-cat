name: _build-frontend

on:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-build-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-
            ${{ runner.os }}-turbo-

      - run: pnpm turbo run build --filter=admin --filter=mini-app --filter=landing --filter=@leadcat/brand

      - name: Upload frontend-dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          retention-days: 1
          path: |
            apps/admin/build/client
            apps/mini-app/build/client
