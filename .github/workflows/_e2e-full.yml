name: _e2e-full

on:
  workflow_call:
    inputs:
      suite:
        description: "Playwright suite: smoke, full (a11y), or all"
        type: string
        default: full

permissions:
  contents: read

jobs:
  e2e-full:
    name: playwright-full
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Build frontends
        run: |
          pnpm install --frozen-lockfile
          pnpm turbo run build --filter=admin --filter=mini-app --filter=landing --filter=@leadcat/brand

      - uses: docker/setup-buildx-action@v4

      - name: Build frontend-deps
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.frontend-deps
          load: true
          tags: leadcat-frontend-deps:local
          cache-from: type=gha,scope=e2e-frontend-deps
          cache-to: type=gha,mode=max,scope=e2e-frontend-deps

      - name: Build backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/backend/Dockerfile
          load: true
          tags: leadcat-e2e-backend:latest
          cache-from: type=gha,scope=e2e-backend
          cache-to: type=gha,mode=max,scope=e2e-backend

      - name: Build landing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.e2e-landing
          load: true
          tags: leadcat-e2e-landing:latest
          build-args: FRONTEND_DEPS_IMAGE=leadcat-frontend-deps:local
          cache-from: type=gha,scope=e2e-landing
          cache-to: type=gha,mode=max,scope=e2e-landing

      - name: Build admin SPA
        run: |
          docker build \
            -f deploy/docker/Dockerfile.e2e-spa \
            --build-arg APP=admin \
            -t leadcat-e2e-admin:latest \
            .

      - name: Build mini-app SPA
        run: |
          docker build \
            -f deploy/docker/Dockerfile.e2e-spa \
            --build-arg APP=mini-app \
            -t leadcat-e2e-mini-app:latest \
            .

      - name: Install e2e deps
        working-directory: e2e
        run: pnpm install --ignore-workspace --frozen-lockfile

      - name: Install Chromium
        working-directory: e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: Run full suite
        env:
          E2E_SKIP_BUILD: "1"
          E2E_SUITE: ${{ inputs.suite }}
        run: bash e2e/run.sh

      - name: Upload
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-full
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
