name: Bug report
description: Something is broken or behaves incorrectly
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please avoid pasting secrets (tokens, `.env`, credentials).

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend (API / bot / workers)
        - Mini App (Telegram)
        - Admin (web)
        - Landing
        - Deploy / infra
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: local / staging / prod; browser or Telegram client; commit or version if known
    validations:
      required: false
