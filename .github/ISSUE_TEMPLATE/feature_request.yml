name: Feature request
description: Suggest an improvement or new capability
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check [docs/NEW-FEATURES.md](https://github.com/luckyrogue/lead-cat/blob/main/docs/NEW-FEATURES.md) for existing product scope.

  - type: textarea
    id: problem
    attributes:
      label: Problem or user story
      description: What problem does this solve? Who is the user?
      placeholder: As a team member, I want to … so that …
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
