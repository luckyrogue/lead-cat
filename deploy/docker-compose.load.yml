# Load-test capacity override: disables rate limits + exposes backend on :8081
# so k6 can reach the backend directly (bypasses the admin nginx on :8090,
# avoiding ephemeral-port exhaustion at high RPS on macOS Docker Desktop).
# Used ONLY for the capacity scenario; see docker-compose.load-shedding.yml for shedding.
services:
  backend:
    environment:
      RATE_LIMIT_DISABLED: "true"
    ports:
      - "8081:8080"
