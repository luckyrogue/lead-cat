name: leadcat-e2e

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: notify
      POSTGRES_PASSWORD: notify
      POSTGRES_DB: notify
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notify"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - e2e

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - e2e

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8125:8025"
    networks:
      - e2e

  backend:
    image: leadcat-e2e-backend:latest
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    environment:
      APP_ENV: development
      AUTH_DEV_MODE: "true"
      RATE_LIMIT_DISABLED: "true"
      AUTO_MIGRATE: "true"
      MASTER_ENCRYPTION_KEY: e2e-master-encryption-key-please-32b
      DATABASE_URL: postgres://notify:notify@postgres:5432/notify?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: e2e-secret-at-least-32-bytes-long-xx
      CALENDAR_STUB: "true"
      APP_BASE_URL: http://localhost:8090
      WEBAPP_URL: http://localhost:8090
      CORS_ALLOWED_ORIGINS: http://localhost:8090
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: e2e@leadcat.test
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    networks:
      - e2e

  admin:
    image: leadcat-e2e-admin:latest
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.e2e-spa
      args:
        APP: admin
    environment:
      API_UPSTREAM: http://backend:8080
    ports:
      - "8090:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - e2e

  mini-app:
    image: leadcat-e2e-mini-app:latest
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.e2e-spa
      args:
        APP: mini-app
    environment:
      API_UPSTREAM: http://backend:8080
    ports:
      - "8092:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - e2e

  landing:
    image: leadcat-e2e-landing:latest
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.e2e-landing
      args:
        FRONTEND_DEPS_IMAGE: ${FRONTEND_DEPS_IMAGE:-leadcat-frontend-deps:local}
    ports:
      - "8091:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - e2e

networks:
  e2e:
    driver: bridge
