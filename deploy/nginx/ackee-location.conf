# Same-origin Ackee proxy — avoids cross-origin tracker API calls.
# Included by SPA nginx and landing SSR front proxy.
location /ackee/ {
    resolver           127.0.0.11 valid=30s ipv6=off;
    set                $ackee_origin "https://analytics.rysdavletov.org";
    proxy_pass         $ackee_origin/;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header   Host analytics.rysdavletov.org;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}
