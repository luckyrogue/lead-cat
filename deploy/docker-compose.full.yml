name: lead-cat-full

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: notify
      POSTGRES_PASSWORD: notify
      POSTGRES_DB: notify
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notify"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://notify:notify@postgres:5432/notify?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      HTTP_ADDR: ":8080"
      AUTO_MIGRATE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

  admin:
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
    environment:
      API_UPSTREAM: http://backend:8080
    depends_on:
      - backend
    ports:
      - "3001:80"

  mini-app:
    build:
      context: ..
      dockerfile: apps/mini-app/Dockerfile
    environment:
      API_UPSTREAM: http://backend:8080
    depends_on:
      - backend
    ports:
      - "3002:80"

  landing:
    build:
      context: ..
      dockerfile: apps/landing/Dockerfile
      args:
        VITE_SITE_URL: http://localhost:3000
    ports:
      - "3000:3000"

volumes:
  pgdata:
