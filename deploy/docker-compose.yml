name: lead-cat

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: notify
      POSTGRES_PASSWORD: notify
      POSTGRES_DB: notify
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notify"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  backend:
    profiles: [stack]
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    env_file:
      - ../.env
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://notify:notify@postgres:5432/notify?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

  admin:
    profiles: [stack]
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
      args:
        FRONTEND_DEPS_IMAGE: ${FRONTEND_DEPS_IMAGE:-leadcat-frontend-deps:local}
    environment:
      API_UPSTREAM: http://backend:8080
    ports:
      - "3001:80"
    depends_on:
      - backend

  mini-app:
    profiles: [stack]
    build:
      context: ..
      dockerfile: apps/mini-app/Dockerfile
      args:
        FRONTEND_DEPS_IMAGE: ${FRONTEND_DEPS_IMAGE:-leadcat-frontend-deps:local}
    environment:
      API_UPSTREAM: http://backend:8080
    ports:
      - "3002:80"
    depends_on:
      - backend

  landing:
    profiles: [stack]
    build:
      context: ..
      dockerfile: apps/landing/Dockerfile
      args:
        FRONTEND_DEPS_IMAGE: ${FRONTEND_DEPS_IMAGE:-leadcat-frontend-deps:local}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
